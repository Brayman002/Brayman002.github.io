<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discord Image Embed Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #18191c;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: #2f3136;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #202225;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        #result {
            display: none;
            margin-top: 25px;
        }

        #generatedURL {
            word-break: break-all;
            padding: 12px;
            background: #202225;
            border-radius: 6px;
        }

        #preview {
            max-width: 100%;
            max-height: 400px;
            margin-top: 20px;
            border-radius: 6px;
        }

        .copy {
            background: #3ba55c;
        }

        .copy:hover {
            background: #2d7d46;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Discord Image Embed</h1>

    <p>
        Enter an image URL and the website you want visitors
        to be redirected to.
    </p>

    <label for="imageURL">Image URL</label>

    <input
        id="imageURL"
        type="url"
        placeholder="https://example.com/image.png"
    >

    <label for="redirectURL">Redirect URL</label>

    <input
        id="redirectURL"
        type="url"
        placeholder="https://example.com"
    >

    <button onclick="generate()">
        Generate Link
    </button>

    <div id="result">

        <h3>Your Link</h3>

        <div id="generatedURL"></div>

        <button class="copy" onclick="copyURL()">
            Copy Link
        </button>

        <h3>Preview</h3>

        <img id="preview" alt="Preview">

    </div>

</div>


<script>

function generate() {

    const imageURL =
        document.getElementById("imageURL").value.trim();

    const redirectURL =
        document.getElementById("redirectURL").value.trim();

    if (!imageURL) {
        alert("Please enter an image URL.");
        return;
    }

    if (!redirectURL) {
        alert("Please enter a redirect URL.");
        return;
    }

    try {

        new URL(imageURL);
        new URL(redirectURL);

    } catch {

        alert("Please enter valid URLs.");
        return;
    }


    const baseURL =
        window.location.origin +
        window.location.pathname;


    const generated =
        baseURL +
        "?image=" +
        encodeURIComponent(imageURL) +
        "&redirect=" +
        encodeURIComponent(redirectURL);


    document.getElementById("generatedURL").textContent =
        generated;

    document.getElementById("preview").src =
        imageURL;

    document.getElementById("result").style.display =
        "block";
}


function copyURL() {

    const url =
        document.getElementById("generatedURL").textContent;

    navigator.clipboard.writeText(url);

    alert("Link copied!");
}


// --------------------------------------------------
// HANDLE GENERATED LINKS
// --------------------------------------------------

const params =
    new URLSearchParams(window.location.search);

const imageURL =
    params.get("image");

const redirectURL =
    params.get("redirect");


if (imageURL && redirectURL) {

    // Show the image while the page is open
    document.body.innerHTML = "";

    const img = document.createElement("img");

    img.src = imageURL;

    img.style.width = "100vw";
    img.style.height = "100vh";
    img.style.objectFit = "contain";

    document.body.appendChild(img);


    // Redirect after a short delay
    setTimeout(() => {

        window.location.replace(redirectURL);

    }, 1000);
}

</script>

</body>
</html>
