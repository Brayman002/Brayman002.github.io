<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Middleclick</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 60px auto;
        padding: 20px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin: 8px 0 20px;
    }

    button {
        padding: 12px 20px;
        cursor: pointer;
    }

    #result {
        display: none;
        margin-top: 30px;
    }

    #generated {
        width: 100%;
        box-sizing: border-box;
    }

    #preview {
        max-width: 100%;
        max-height: 400px;
        margin-top: 20px;
    }
</style>
```

</head>

<body>

```
<h1>Middleclick</h1>

<label>
    Image URL
</label>

<input
    id="image"
    type="url"
    placeholder="https://example.com/image.png"
>

<label>
    Redirect URL
</label>

<input
    id="redirect"
    type="url"
    placeholder="https://example.com"
>

<button onclick="createLink()">
    Create Link
</button>

<div id="result">

    <h2>Your Link</h2>

    <input
        id="generated"
        readonly
    >

    <button onclick="copyLink()">
        Copy Link
    </button>

    <h2>Image Preview</h2>

    <img id="preview">

</div>
```

<script>

function createLink() {

    const image =
        document.getElementById("image").value.trim();

    const redirect =
        document.getElementById("redirect").value.trim();

    if (!image) {
        alert("Enter an image URL.");
        return;
    }

    if (!redirect) {
        alert("Enter a redirect URL.");
        return;
    }

    try {
        new URL(image);
        new URL(redirect);
    } catch {
        alert("Both URLs must be valid URLs.");
        return;
    }

    /*
        CHANGE THIS to your Cloudflare Worker URL.
    */

    const worker =
        "https://YOUR-WORKER.workers.dev";

    const generated =
        worker +
        "/?image=" +
        encodeURIComponent(image) +
        "&redirect=" +
        encodeURIComponent(redirect);

    document.getElementById("generated").value =
        generated;

    document.getElementById("preview").src =
        image;

    document.getElementById("result").style.display =
        "block";
}

async function copyLink() {

    const input =
        document.getElementById("generated");

    await navigator.clipboard.writeText(input.value);

    alert("Copied!");

}

</script>

</body>
</html>
